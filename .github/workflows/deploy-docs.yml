name: Website

on:
  push:
    branches: [main]
    paths:
      - 'docs/web/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: smnandre/.github/.github/workflows/Pages.yml@main
    with:
      path: docs/web
