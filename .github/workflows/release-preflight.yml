name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        default: '1.0.1'

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    uses: smnandre/.github/.github/workflows/macOS-preflight.yml@dde72e3a0d3ba29999360eab39e78a111d572b47
    with:
      version: ${{ inputs.version }}
      runner: macos-26
      app_name: SymfonyCLIMenuBar
      binary_name: SymfonyCLIMenuBar
      bundle_id: dev.smnandre.symfony-cli-menubar
      app_path: build/SymfonyCLIMenuBar.app
      dmg_directory: dist
      version_file: config/Version.plist
    secrets: inherit
