name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    uses: smnandre/.github/.github/workflows/macOS-preflight.yml@main
    with:
      version: ${{ inputs.version }}
      runner: macos-15
      app_name: SymfonyCLIMenuBar
      binary_name: SymfonyCLIMenuBar
      bundle_id: dev.smnandre.symfony-cli-menubar
      app_path: SymfonyCLIMenuBar.app
      dmg_directory: .
      version_file: config/Version.plist
    secrets: inherit
