name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    uses: smnandre/.github/.github/workflows/macOS-release.yml@main
    with:
      runner: macos-15
      app_name: SymfonyCLIMenuBar
      binary_name: SymfonyCLIMenuBar
      bundle_id: dev.smnandre.symfony-cli-menubar
      app_path: SymfonyCLIMenuBar.app
      dmg_directory: .
      version_file: config/Version.plist
      cask_token: symfony-cli-menubar
    secrets: inherit
