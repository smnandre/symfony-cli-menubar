name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    uses: smnandre/.github/.github/workflows/macOS-release.yml@dde72e3a0d3ba29999360eab39e78a111d572b47
    with:
      runner: macos-26
      app_name: SymfonyCLIMenuBar
      binary_name: SymfonyCLIMenuBar
      bundle_id: dev.smnandre.symfony-cli-menubar
      app_path: build/SymfonyCLIMenuBar.app
      dmg_directory: dist
      version_file: config/Version.plist
      cask_token: symfony-cli-menubar
    secrets: inherit
